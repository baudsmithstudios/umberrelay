{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Umberrelay{{if .Title}} — {{.Title}}{{end}}</title>
    <link rel="stylesheet" href="/static/elumkit/index.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <a class="elum-skip-link" href="#main">Skip to content</a>
    <nav class="elum-navbar ur-navbar" aria-label="Main navigation">
        <a class="elum-navbar-brand ur-brand" href="/"><b>Umber</b><span>relay</span></a>
        <section class="elum-navlinks">
            <a class="elum-navlink" href="/"{{if eq .Active "activity"}} aria-current="page"{{end}}>Activity</a>
            <a class="elum-navlink" href="/settings"{{if eq .Active "settings"}} aria-current="page"{{end}}>Settings</a>
        </section>
    </nav>
    <main id="main">
        {{template "content" .}}
    </main>
    <footer class="elum-footer">
        <p class="elum-footer-brand">Umberrelay 0.2.0 · forwarding DNS with attribution</p>
    </footer>
    <script src="/static/js/htmx.min.js"></script>
    {{block "page_scripts" .}}{{end}}
</body>
</html>
{{end}}
