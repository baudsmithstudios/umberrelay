{{define "label-edit"}}
<div id="device-label-editor">
    <form class="elum-query ur-label-editor" hx-post="/ui/devices/{{.Device.MAC}}/label" hx-target="#device-label-editor" hx-swap="outerHTML">
        <div class="elum-field-float">
            <input class="elum-input" id="device-label" type="text" name="label" value="{{.Device.Label}}" maxlength="128" placeholder=" ">
            <label class="elum-label" for="device-label">Device Label</label>
        </div>
        <button class="elum-button" type="submit">Save</button>
    </form>
</div>
{{end}}

{{define "source-label-edit"}}
<div id="device-label-editor">
    <form class="elum-query ur-label-editor" hx-post="/ui/sources/{{.SourceIP}}/label" hx-target="#device-label-editor" hx-swap="outerHTML">
        <div class="elum-field-float">
            <input class="elum-input" id="device-label" type="text" name="label" value="{{.SourceLabel}}" maxlength="128" placeholder=" ">
            <label class="elum-label" for="device-label">Label</label>
        </div>
        <button class="elum-button" type="submit">Save</button>
    </form>
</div>
{{end}}

{{define "live-query-stream"}}
<section class="elum-stack" id="live-query-stream" data-actor-key="{{.}}" data-category-tones="{{categoryTonesJSON}}" aria-label="Live query stream">
    <form class="elum-query ur-filters" role="search" aria-label="Live stream filters">
        <div class="elum-field">
            <label class="elum-label" for="live-query-domain-filter">Domain</label>
            <input class="elum-input" type="search" id="live-query-domain-filter" placeholder="filter domain">
        </div>
        <div class="elum-field">
            <label class="elum-label" for="live-query-category-filter">Category</label>
            <select class="elum-select" id="live-query-category-filter">
                <option value="">All categories</option>
                {{range categoryOptions}}
                <option value="{{.Value}}">{{.Label}}</option>
                {{end}}
            </select>
        </div>
        <button class="elum-button" type="button" id="live-query-clear">Clear</button>
    </form>
    <p role="status" id="live-query-status"></p>
    <ul class="elum-feed" id="live-query-feed">
        <li class="elum-feed-item">Waiting for live queries…</li>
    </ul>
</section>
{{end}}

{{define "domain-row"}}
<tr role="row" id="domain-row-{{.Domain}}">
    <td data-label="Domain" role="cell">{{.Domain}}</td>
    <td data-label="Class" role="cell"><span class="elum-status-label" data-tone="{{categoryTone .Category}}">{{.ClassificationLabel}}</span></td>
    <td data-label="Queries" data-align="end" data-numeric="true" role="cell">{{.QueryCount}}</td>
    {{if eq .Scope "network"}}
    <td data-label="Reach" data-align="end" data-numeric="true" role="cell">{{.DeviceCountLabel}}</td>
    {{end}}
    <td data-label="Override" role="cell">
        <form hx-post="/ui/overrides/{{.Domain}}" hx-target="closest tr" hx-swap="outerHTML" style="display: flex; gap: var(--elum-space-2); align-items: center">
            <input type="hidden" name="actor_key" value="{{.ActorKey}}">
            <select class="elum-select" name="category" aria-label="Override category for {{.Domain}}">
                {{$row := .}}
                {{range categoryOptions}}
                <option value="{{.Value}}"{{if or (eq $row.Category .Value) (and (eq $row.Category "") (eq .Value "uncategorized"))}} selected{{end}}>{{.Label}}</option>
                {{end}}
            </select>
            <button class="elum-button" data-variant="tertiary" type="submit">Set</button>
        </form>
    </td>
</tr>
{{end}}
