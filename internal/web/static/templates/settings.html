{{define "content"}}
<div class="elum-container elum-stack ur-settings">

    <article class="elum-card elum-card-labeled elum-stack">
        <header class="elum-card-header"><h2 class="elum-card-title">Retention</h2></header>
        <form class="elum-stack" hx-post="/ui/settings" hx-swap="none">
            <div class="elum-grid">
                <div class="elum-field">
                    <label class="elum-label" for="retention_days">Days to retain query data</label>
                    <input class="elum-input" type="number" id="retention_days" name="retention_days" value="{{.RetentionDays}}" min="1" max="365">
                </div>
                <div class="elum-field">
                    <label class="elum-label" for="list_refresh_hours">Hours between list refreshes</label>
                    <input class="elum-input" type="number" id="list_refresh_hours" name="list_refresh_hours" value="{{.ListRefreshHours}}" min="1" max="168">
                </div>
            </div>
            <div class="ur-card-actions"><button class="elum-button" type="submit">Save</button></div>
        </form>
    </article>

    <article class="elum-card elum-card-labeled elum-stack">
        <header class="elum-card-header"><h2 class="elum-card-title">Classification lists</h2></header>
        <aside class="elum-alert"{{if .ListRefreshStatusTone}} data-tone="{{.ListRefreshStatusTone}}"{{end}} role="status">
            {{if eq .ListRefreshStatusTone "error"}}<span class="elum-badge" data-tone="error">[FAILED]</span>
            {{else if eq .ListRefreshStatusTone "success"}}<span class="elum-badge" data-tone="success">[OK]</span>
            {{end}}{{.ListRefreshStatusText}}
        </aside>
        <form class="ur-card-actions" hx-post="/ui/lists/refresh" hx-swap="none">
            <button class="elum-button" type="submit">Refresh lists now</button>
        </form>
        <div class="elum-table-wrap" tabindex="0" role="region" aria-label="Classification lists">
            <table class="elum-table" role="table">
                <thead role="rowgroup">
                    <tr role="row">
                        <th scope="col" role="columnheader">Name</th>
                        <th scope="col" role="columnheader">Category</th>
                        <th scope="col" role="columnheader">Enabled</th>
                        <th scope="col" data-align="end" role="columnheader">Actions</th>
                    </tr>
                </thead>
                <tbody role="rowgroup">
                    {{range .Lists}}
                    <tr role="row">
                        <td data-label="Name" role="cell">{{.Name}}</td>
                        <td data-label="Category" role="cell">{{.Category}}</td>
                        <td data-label="Enabled" role="cell">
                            <form hx-post="/ui/lists/{{.ID}}/enabled" hx-trigger="change" hx-swap="none">
                                <label class="elum-choice">
                                    <input class="elum-switch" type="checkbox" role="switch" name="enabled" value="true" aria-label="Enable {{.Name}}"{{if .Enabled}} checked{{end}}>
                                    <input type="hidden" name="enabled" value="false">
                                </label>
                            </form>
                        </td>
                        <td data-label="Actions" data-align="end" role="cell">
                            <form hx-post="/ui/lists/{{.ID}}/delete" hx-swap="none">
                                <button class="elum-button" data-variant="tertiary" type="submit" hx-confirm="Remove this list?">Remove</button>
                            </form>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </article>

    <article class="elum-card elum-card-labeled elum-stack">
        <header class="elum-card-header"><h2 class="elum-card-title">Add list</h2></header>
        <form class="elum-stack" hx-post="/ui/lists" hx-swap="none">
            <div class="elum-field">
                <label class="elum-label" for="list_url">URL</label>
                <input class="elum-input" type="url" id="list_url" name="url" required placeholder="https://example.com/list.txt">
            </div>
            <div class="elum-grid">
                <div class="elum-field">
                    <label class="elum-label" for="list_name">Name</label>
                    <input class="elum-input" type="text" id="list_name" name="name" required placeholder="My list">
                </div>
                <div class="elum-field">
                    <label class="elum-label" for="list_category">Category</label>
                    <select class="elum-select" id="list_category" name="category">
                        <option value="tracking">Tracking</option>
                        <option value="advertising">Advertising</option>
                        <option value="analytics">Analytics</option>
                        <option value="telemetry">Telemetry</option>
                        <option value="malware">Malware</option>
                        <option value="uncategorized">Uncategorized</option>
                    </select>
                </div>
            </div>
            <div class="ur-card-actions"><button class="elum-button" type="submit">Add</button></div>
        </form>
    </article>

</div>
{{end}}
